<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lichess Puzzle Finder</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f0f0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        select, input, button { padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; }
        button { background: #007bff; color: white; cursor: pointer; border: none; font-weight: bold; }
        button:hover { background: #0056b3; }
        .puzzle-card { border: 1px solid #eee; padding: 15px; border-radius: 6px; margin-bottom: 15px; background: #fafafa; }
        .puzzle-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .themes { display: flex; flex-wrap: wrap; gap: 5px; }
        .theme { background: #e0e0e0; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
        .fen { background: #eee; padding: 10px; font-family: monospace; overflow-x: auto; border-radius: 4px;}
        .solution-btn { margin-top: 10px; background: #28a745; }
        .solution { margin-top: 10px; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Static Puzzle Finder</h1>
    <p>Find chess puzzles using our static API directly from GitHub pages!</p>
    
    <div class="controls">
        <label for="ratingBlock">Rating Group:</label>
        <select id="ratingBlock">
            <option value="">Loading...</option>
        </select>
        
        <label for="themeFilter">Filter Theme:</label>
        <input type="text" id="themeFilter" placeholder="e.g. endgame, fork" />
        
        <button id="searchBtn">Find a Puzzle</button>
    </div>

    <div id="results">
        <p>Select a rating group and click "Find a Puzzle"!</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
