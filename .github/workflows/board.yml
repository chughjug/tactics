name: Generate LogiqBoard Link

on:
  workflow_dispatch:

jobs:
  create-board:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Generate and Scrape Link
        run: |
          python -c "
          from playwright.sync_api import sync_playwright

          def create_board():
              with sync_playwright() as p:
                  # Launch the browser
                  browser = p.chromium.launch(headless=True)
                  
                  # Create a new, isolated browser context. 
                  # This acts as an incognito window, ensuring cache and cookies are entirely cleared for every run.
                  context = browser.new_context()
                  page = context.new_page()
                  
                  try:
                      # Navigate to the site
                      page.goto('https://logiqboard.com/')
                      
                      # Click the button using its specific CSS class
                      page.locator('button.create-board-btn').click()
                      
                      # Wait dynamically for the URL to redirect to the new board room
                      page.wait_for_url('**/boards/*') 
                      
                      print('=== Board Successfully Created ===')
                      print(f'Shared Room URL: {page.url}')
                      
                  except Exception as e:
                      print(f'Error occurred: {e}')
                  finally:
                      # Clean up
                      context.close()
                      browser.close()

          if __name__ == '__main__':
              create_board()
          "
